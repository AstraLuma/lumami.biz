
name: Publish on Teahouse

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: "teahouse"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: pip install pipenv
      - run: pipenv install
      - run: pipenv run mkdocs build
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: ./site

  # Deployment job
  deploy:
    if: github.repository == 'AstraLuma/lumami.biz' && github.ref == 'refs/heads/trunk'
    environment:
      name: teahouse
      url: https://lumami.biz
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: ./site
      - name: Upload
        uses: teahouse-hosting/upload@trunk
        with:
          domain: lumami.biz
          root: ./site
      - name: Upload (WWW)
        uses: teahouse-hosting/upload@trunk
        with:
          domain: www.lumami.biz
          root: ./site
